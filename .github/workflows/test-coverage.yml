name: Test Coverage

on:
  push:
    branches: [ main, develop, Ziqi ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-coverage:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      # Backend Tests
      - name: Backend Tests
        working-directory: ./backend
        run: |
          npm install
          npm test
      
      # Frontend Tests
      - name: Frontend Tests
        working-directory: ./frontend
        run: |
          npm install
          npm run test:ci
      
      - name: All tests completed
        run: echo "All tests passed successfully!"
