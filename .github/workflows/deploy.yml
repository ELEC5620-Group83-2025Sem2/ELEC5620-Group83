name: Deploy to Production

on:
  push:
    branches: [ main, dev, test_cicd ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      # Backend Deployment
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install
      
      - name: Test backend
        working-directory: ./backend
        run: npm test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      
      # Frontend Deployment
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      
      # Docker Image Building (only on main branch)
      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/test_cicd'
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push backend Docker image
        if: github.ref == 'refs/heads/test_cicd'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hsc-power-backend:latest
            ghcr.io/${{ github.repository_owner }}/hsc-power-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/hsc-power-backend:${{ github.ref_name }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/hsc-power-backend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/hsc-power-backend:buildcache,mode=max
      
      - name: Build and push frontend Docker image
        if: github.ref == 'refs/heads/test_cicd'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hsc-power-frontend:latest
            ghcr.io/${{ github.repository_owner }}/hsc-power-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/hsc-power-frontend:${{ github.ref_name }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/hsc-power-frontend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/hsc-power-frontend:buildcache,mode=max
      
      - name: Deploy to hosting service
        run: |
          echo "🚀 Deployment configured"
          echo "Add your deployment steps here (e.g., Vercel, Netlify, Railway, etc.)"
          # Example for Vercel:
          # npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
          
          # Example for custom server:
          # scp -r ./frontend/dist user@server:/var/www/hsc-power
          # ssh user@server 'pm2 restart backend'
      
      - name: Notify deployment status
        if: always()
        run: |
          echo "Deployment completed: ${{ job.status }}"
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "✅ Docker images built and pushed to registry"
          fi
          # Add notification to Slack, Discord, etc. if needed

