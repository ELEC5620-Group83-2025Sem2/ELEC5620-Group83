name: Deploy to Production

on:
  push:
    branches: [ main, dev, test_cicd ]
  pull_request:
    types: [opened]
    branches: [ test_cicd ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # For merged PRs, checkout the base branch (test_cicd) which contains the merged code
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
          # Use the full commit SHA for merged PRs
          sha: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      # Backend Deployment
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install
      
      - name: Test backend
        working-directory: ./backend
        run: npm test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      
      # Frontend Deployment
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      
      # Docker Image Building (only on test_cicd branch)
      - name: Prepare Docker image tags
        if: github.ref == 'refs/heads/test_cicd' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'test_cicd')
        run: |
          echo "IMAGE_OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REF_NAME_LOWER=$(echo '${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]' | tr '/' '-')" >> $GITHUB_ENV
      
      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/test_cicd' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'test_cicd')
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/test_cicd' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'test_cicd')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push backend Docker image
        if: github.ref == 'refs/heads/test_cicd' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'test_cicd')
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER_LOWER }}/hsc-power-backend:latest
            ghcr.io/${{ env.IMAGE_OWNER_LOWER }}/hsc-power-backend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER_LOWER }}/hsc-power-backend:${{ env.REF_NAME_LOWER }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_OWNER_LOWER }}/hsc-power-backend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_OWNER_LOWER }}/hsc-power-backend:buildcache,mode=max
      
      - name: Build and push frontend Docker image
        if: github.ref == 'refs/heads/test_cicd' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'test_cicd')
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER_LOWER }}/hsc-power-frontend:latest
            ghcr.io/${{ env.IMAGE_OWNER_LOWER }}/hsc-power-frontend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER_LOWER }}/hsc-power-frontend:${{ env.REF_NAME_LOWER }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_OWNER_LOWER }}/hsc-power-frontend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_OWNER_LOWER }}/hsc-power-frontend:buildcache,mode=max
      
      - name: Deploy to hosting service
        run: |
          echo "🚀 Deployment configured"
          echo "Add your deployment steps here (e.g., Vercel, Netlify, Railway, etc.)"
          # Example for Vercel:
          # npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
          
          # Example for custom server:
          # scp -r ./frontend/dist user@server:/var/www/hsc-power
          # ssh user@server 'pm2 restart backend'
      
      - name: Notify deployment status
        if: always()
        run: |
          echo "Deployment completed: ${{ job.status }}"
          if [ "${{ github.ref }}" == "refs/heads/test_cicd" ] || [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "✅ Docker images built and pushed to GitHub Container Registry"
            echo "Images available at:"
            echo "  - ghcr.io/${{ env.IMAGE_OWNER_LOWER }}/hsc-power-backend:latest"
            echo "  - ghcr.io/${{ env.IMAGE_OWNER_LOWER }}/hsc-power-frontend:latest"
          fi
          # Add notification to Slack, Discord, etc. if needed

